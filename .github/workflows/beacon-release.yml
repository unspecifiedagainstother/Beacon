name: Release

# Every push to main builds Linux, Windows and macOS and publishes a
# prerelease tagged v<version>-build.<run>. Pushing a v* tag publishes a
# regular release under that tag instead.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v8.31.0). Leave empty to use the package.json version.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true

      - name: Build
        run: |
          pnpm run generate
          pnpm run build:rolldown:prod
          pnpm run build:release --linux deb AppImage --x64 --publish=never
        env:
          CC: sccache gcc
          CXX: sccache g++
          SCCACHE_GHA_ENABLED: true
          DISABLE_INSPECT_FUSE: on
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true

      - name: Disable code signing
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.build.win.signtoolOptions.certificateSubjectName;
            delete pkg.build.win.signtoolOptions.certificateSha1;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        shell: bash
        run: |
          pnpm run generate
          pnpm run build:rolldown:prod
          pnpm run build:release --win nsis --x64 --publish=never
        env:
          DISABLE_INSPECT_FUSE: on
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: release/*.exe

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          cache-electron-builder: true

      # No Apple Developer ID: sign ad hoc so the app still launches on Apple
      # silicon. Notarization skips itself without APPLE_* secrets.
      - name: Ad hoc signing script
        run: |
          cat > "$RUNNER_TEMP/sign-adhoc.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          codesign --force --deep --sign - "$1"
          EOF
          chmod +x "$RUNNER_TEMP/sign-adhoc.sh"

      - name: Build
        run: |
          pnpm run generate
          pnpm run build:rolldown:prod
          pnpm run build:release --publish=never
        env:
          DISABLE_INSPECT_FUSE: on
          SIGN_MACOS_SCRIPT: ${{ runner.temp }}/sign-adhoc.sh
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  release:
    name: Publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pick tag
        id: tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          prerelease=false
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v$version-build.${{ github.run_number }}"
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" dist/* \
              --title "Beacon $TAG (${GITHUB_SHA::7})" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              "${flags[@]}"
          fi
